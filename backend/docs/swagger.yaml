      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/trial.Trial'
      summary: Create a trial for a portal
      tags:
      - trials
  /trials/{id}:
    delete:
      parameters:
      - description: Trial ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete a trial
      tags:
      - trials
    get:
      parameters:
      - description: Trial ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trial.Trial'
      summary: Get trial by ID
      tags:
      - trials
    put:
      consumes:
      - application/json
      parameters:
      - description: Trial ID
        in: path
        name: id
        required: true
        type: integer
      - description: Trial data
        in: body
        name: trial
        required: true
        schema:
          $ref: '#/definitions/trial.Trial'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trial.Trial'
      summary: Update a trial
      tags:
      - trials
  /trials/{id}/events:
    get:
      parameters:
      - description: Trial ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/event.Event'
            type: array
      summary: List events for a trial
      tags:
      - events
    post:
      consumes:
      - application/json
      parameters:
      - description: Trial ID
        in: path
        name: id
        required: true
        type: integer
      - description: Event data
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/event.Event'
      produces:
      - application/json
      responses:
        "201":
